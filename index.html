<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History Explorer — 7th Grade</title>
<style>
  :root {
    --bg: #f5f2e9;
    --ink: #1d1a17;
    --accent: #a8402b;
    --card: #ffffff;
    --header: #ffffff;
    --side: #2a1f1a;
    --side-ink: #f3ece2;
    --side-muted: #a39887;
    --rule: #d9d0bd;
    --muted: #5e564c;
  }
  [data-theme="dark"] {
    --bg: #17140f; --ink: #ece4d6; --accent: #e0826a; --card: #221e18;
    --header: #1f1b15; --side: #0f0d0a; --rule: #3a3329; --muted: #a39887;
  }
  [data-theme="parchment"] {
    --bg: #ecdcb8; --ink: #2b2112; --accent: #8a3a1c; --card: #f6ecd2;
    --header: #f3e6c4; --side: #3a2a14; --rule: #cdb98a; --muted: #6b5a3a;
  }
  [data-theme="ocean"] {
    --bg: #eaf1f7; --ink: #13222f; --accent: #1f5d8c; --card: #ffffff;
    --header: #ffffff; --side: #12293b; --rule: #c7d6e3; --muted: #4c6073;
  }
  [data-theme="forest"] {
    --bg: #eef3ea; --ink: #172319; --accent: #2f6b3a; --card: #ffffff;
    --header: #ffffff; --side: #1b2d1f; --rule: #cbd9c4; --muted: #4f624f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    height: 58px;
    flex: none;
    background: var(--header);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 22px;
    position: relative;
    z-index: 20;
  }
  .grid-btn {
    background: none; border: 0; padding: 6px; cursor: pointer;
    display: grid; grid-template-columns: repeat(3, 4px); gap: 3px;
  }
  .grid-btn i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); opacity: .75; display: block; }
  .grid-btn:hover i { background: var(--accent); opacity: 1; }
  .brand { font-weight: 700; font-size: 19px; color: var(--accent); text-decoration: none; letter-spacing: .1px; }

  .search { margin-left: auto; position: relative; width: min(280px, 40vw); }
  .search input {
    width: 100%;
    font: 14px Georgia, serif;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 8px 14px 8px 34px;
    outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search .mag {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 11px; height: 11px; border: 1.5px solid var(--muted); border-radius: 50%; pointer-events: none;
  }
  .search .mag::after {
    content: ""; position: absolute; width: 5px; height: 1.5px; background: var(--muted);
    right: -5px; bottom: -2px; transform: rotate(45deg);
  }
  .results {
    position: absolute; top: calc(100% + 6px); right: 0; width: min(380px, 90vw);
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    max-height: 60vh; overflow: auto; display: none;
  }
  .results.open { display: block; }
  .results a {
    display: block; padding: 10px 14px; text-decoration: none; color: var(--ink);
    border-bottom: 1px solid var(--rule); font-size: 14px;
  }
  .results a:last-child { border-bottom: 0; }
  .results a:hover, .results a.focus { background: var(--bg); }
  .results b { color: var(--accent); display: block; margin-bottom: 2px; }
  .results span { color: var(--muted); font-size: 13px; }
  .results mark { background: rgba(168,64,43,.18); color: inherit; border-radius: 2px; }
  .results .none { padding: 12px 14px; color: var(--muted); font-style: italic; font-size: 14px; }

  /* ---------- Layout ---------- */
  .layout { flex: 1; display: flex; min-height: 0; position: relative; }

  nav {
    width: 260px; flex: none;
    background: var(--side);
    color: var(--side-ink);
    padding: 22px 12px 14px;
    overflow-y: auto;
    display: flex; flex-direction: column;
    transition: margin-left .25s ease;
  }
  body.collapsed nav { margin-left: -260px; }
  nav h4 {
    margin: 22px 12px 8px;
    font-size: 11px; letter-spacing: 1.6px; font-weight: 400;
    text-transform: uppercase; color: var(--side-muted);
  }
  nav h4:first-child { margin-top: 0; }
  nav a.item {
    display: block; padding: 8px 12px; margin-bottom: 2px;
    color: var(--side-ink); text-decoration: none; font-size: 15px;
    border-radius: 6px; border-left: 3px solid transparent;
  }
  nav a.item:hover { background: rgba(255,255,255,.08); }
  nav a.item.active { background: rgba(255,255,255,.14); border-left-color: var(--accent); }
  [data-theme="dark"] nav a.item.active { border-left-color: var(--accent); }
  .nav-foot { margin-top: auto; padding: 14px 12px 0; border-top: 1px solid rgba(255,255,255,.12); }
  .nav-foot a { color: var(--side-muted); font-size: 12px; text-decoration: none; letter-spacing: .3px; }
  .nav-foot a:hover { color: var(--side-ink); text-decoration: underline; }

  main { flex: 1; overflow-y: auto; padding: 38px 40px 80px; scroll-behavior: smooth; }
  article { max-width: 540px; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- Article typography ---------- */
  article h1 { margin: 0; font-size: 35px; line-height: 1.15; color: var(--accent); }
  article .sub { margin: 6px 0 0; font-style: italic; font-size: 14px; color: var(--muted); }
  article .rule { border: 0; border-top: 1px solid var(--rule); margin: 14px 0 26px; }
  article h2 { margin: 30px 0 10px; font-size: 22px; color: var(--accent); }
  article p { margin: 0 0 14px; font-size: 14.5px; line-height: 1.6; }
  article ul { margin: 0 0 16px; padding-left: 24px; font-size: 14.5px; line-height: 1.7; }
  article strong { font-weight: 700; }

  .card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 18px 22px 8px; margin: 18px 0 8px;
  }
  .card h3 { margin: 0 0 10px; font-size: 16px; }
  .card h3:not(:first-child) { margin-top: 14px; }

  .callout {
    background: var(--card); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; padding: 10px 14px; margin: 18px 0;
    font-size: 14.5px; line-height: 1.55;
  }
  .callout b.lead { color: var(--accent); }

  .timeline { border-left: 3px solid var(--accent); padding-left: 10px; margin: 14px 0 18px; }
  .timeline div { font-size: 14.5px; line-height: 1.4; margin-bottom: 8px; }
  .timeline small { display: block; color: var(--accent); font-weight: 700; font-size: 11.5px; }

  .more {
    margin-top: 28px; padding-top: 10px; border-top: 1px dotted var(--rule);
    font-style: italic; font-size: 12.5px; color: var(--muted);
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 760px) {
    nav { position: absolute; z-index: 15; height: 100%; box-shadow: 4px 0 20px rgba(0,0,0,.3); }
    body:not(.collapsed) nav { margin-left: 0; }
    body.collapsed nav { margin-left: -270px; }
    main { padding: 26px 20px 60px; }
    article h1 { font-size: 30px; }
  }
</style>
</head>
<body>

<header>
  <button class="grid-btn" id="toggle" aria-label="Toggle menu">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </button>
  <a class="brand" href="#greece">History Explorer</a>
  <div class="search">
    <span class="mag"></span>
    <input id="q" type="search" placeholder="Search articles, people, events..." autocomplete="off">
    <div class="results" id="results"></div>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><article id="article"></article></main>
</div>

        <li><strong>Steam engine</strong> (James Watt) — powered factories, trains, and ships.</li>
        <li><strong>Cotton gin</strong> — sped up cotton production.</li>
        <li><strong>Railroads</strong> — connected cities like never before.</li>
        <li><strong>Telegraph</strong> — sent messages across continents in minutes.</li>
      </ul>
      <h2>Life in the Cities</h2>
      <p>Millions of people moved from farms to cities to work in factories. Conditions were often dangerous, hours were long, and even children worked. Over time, reforms led to safer jobs, schools, and shorter work weeks.</p>
      <div class="callout"><b class="lead">Impact:</b> The Industrial Revolution created the modern world — but also pollution, child labor crises, and huge gaps between rich and poor.</div>
      <div class="more">More chapters coming — World Wars, Civil Rights Movement, the Space Age, and beyond.</div>`
  }
};

/* ================== RENDER ================== */
var nav = document.getElementById("nav");
var main = document.getElementById("main");
var article = document.getElementById("article");

// Sidebar
nav.innerHTML = GROUPS.map(function (g) {
  return "<h4>" + g.title.replace("&", "&amp;") + "</h4>" +
    g.ids.map(function (id) {
      return '<a class="item" href="#' + id + '" data-id="' + id + '">' + ARTICLES[id].title.replace("&", "&amp;") + "</a>";
    }).join("");
}).join("") +
'<div class="nav-foot"><a href="index2.html" id="settings">settings</a></div>';

function show(id) {
  if (!ARTICLES[id]) id = "greece";
  var a = ARTICLES[id];
  article.style.animation = "none";
  void article.offsetWidth;                 // restart the fade animation
  article.style.animation = "";
  article.innerHTML =
    "<h1>" + a.title.replace("&", "&amp;") + "</h1>" +
    '<p class="sub">A 7th grade journey through the ages</p>' +
    '<hr class="rule">' + a.html;
  main.scrollTop = 0;
  document.title = a.title + " — History Explorer";
  nav.querySelectorAll("a.item").forEach(function (el) {
    el.classList.toggle("active", el.dataset.id === id);
  });
  if (window.innerWidth <= 760) document.body.classList.add("collapsed");
}

window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
show(location.hash.slice(1));

// Grid button toggles the sidebar
var toggle = document.getElementById("toggle");
if (window.innerWidth <= 760) document.body.classList.add("collapsed");
toggle.addEventListener("click", function () { document.body.classList.toggle("collapsed"); });

/* ================== SEARCH ================== */
var q = document.getElementById("q");
var results = document.getElementById("results");
var plain = {};
Object.keys(ARTICLES).forEach(function (id) {
  var tmp = document.createElement("div");
  tmp.innerHTML = ARTICLES[id].html;
  plain[id] = tmp.textContent.replace(/\s+/g, " ").trim();
});

function escapeHtml(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function runSearch() {
  var term = q.value.trim();
  if (!term) { results.classList.remove("open"); results.innerHTML = ""; return; }
  var re = new RegExp(escapeRe(term), "i");
  var hits = [];
  Object.keys(ARTICLES).forEach(function (id) {
    var inTitle = re.test(ARTICLES[id].title);
    var m = plain[id].match(re);
    if (inTitle || m) {
      var snippet = "";
      if (m) {
        var start = Math.max(0, m.index - 40);
        snippet = (start > 0 ? "…" : "") + plain[id].slice(start, m.index + term.length + 70) + "…";
      } else {
        snippet = plain[id].slice(0, 100) + "…";
      }
      hits.push({ id: id, title: ARTICLES[id].title, snippet: snippet, score: inTitle ? 0 : 1 });
    }
  });
  hits.sort(function (a, b) { return a.score - b.score; });
  var hl = new RegExp("(" + escapeRe(term) + ")", "ig");
  results.innerHTML = hits.length
    ? hits.map(function (h) {
        return '<a href="#' + h.id + '"><b>' + escapeHtml(h.title) + "</b><span>" +
               escapeHtml(h.snippet).replace(hl, "<mark>$1</mark>") + "</span></a>";
      }).join("")
    : '<div class="none">No matches for "' + escapeHtml(term) + '"</div>';
  results.classList.add("open");
}
q.addEventListener("input", runSearch);
q.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    var first = results.querySelector("a");
    if (first) { location.hash = first.getAttribute("href"); q.value = ""; runSearch(); q.blur(); }
  } else if (e.key === "Escape") { q.value = ""; runSearch(); q.blur(); }
});
results.addEventListener("click", function () { q.value = ""; runSearch(); });
document.addEventListener("click", function (e) {
  if (!e.target.closest(".search")) results.classList.remove("open");
});
</script>
